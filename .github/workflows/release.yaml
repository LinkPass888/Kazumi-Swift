---
name: "release"

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

env:
  SCHEME: Runner
  PROJECT: ios/Runner.xcodeproj
  MAC_SCHEME: Kazumi
  MAC_PROJECT: macos/Kazumi.xcodeproj
  # 规则开发者凭据在原生版本中通过 Keychain / Info.plist 注入，这里保留同一套 Secret 出口。
  DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
  DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
  KAZUMI_APPID: ${{ secrets.KAZUMI_APPID }}
  KAZUMI_KEY: ${{ secrets.KAZUMI_KEY }}

jobs:
  build-ios:
    name: "Release for iOS"
    # 和 pr.yaml 用同一套镜像（public preview，label 就叫 xcode-27），不写死 27.x 的小版本。
    # 之前这里是 macos-26（默认 Xcode 26.6 / iOS SDK 26.5）：那样编出来的包不认识
    # iOS 27 的 NowPlaying 框架，canImport 直接为假，发出去的 IPA 会悄悄退回旧接口。
    runs-on: "xcode-27"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Extract tag name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Echo build progress
        run: echo "Kazumi_ios_${tag}.ipa build progress"

      # 只把版本号打进日志：这个镜像的小版本会随 GitHub 更新，钉死路径反而会在镜像升级那天断掉。
      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios

      - name: Resolve Swift Packages
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" | xcbeautify

      - name: Build archive (no codesign)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Kazumi.xcarchive" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            DANDAN_APP_ID="${{ secrets.DANDANAPI_APPID }}" \
            DANDAN_APP_SECRET="${{ secrets.DANDANAPI_KEY }}" \
            | xcbeautify

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/Kazumi.xcarchive/Products/Applications/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到 Runner.app：$APP_PATH" >&2
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app
          # 无签名打包：对嵌入的动态库做 ad-hoc 签名，便于侧载安装。
          find Payload/Runner.app -type d -name "*.framework" -exec codesign --force --sign - {} \;
          find Payload/Runner.app -type f -name "*.dylib" -exec codesign --force --sign - {} \;
          zip -q -r "Kazumi_ios_${tag}_no_sign.ipa" Payload
          ls -lh "Kazumi_ios_${tag}_no_sign.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios_outputs
          path: Kazumi_ios_*.ipa
          if-no-files-found: error

  # macOS 版：和 iOS 同一次发版一起出包。产物是不签名的 .zip（里面是 Kazumi.app），
  # 和 iOS 那个 no_sign ipa 一样属于侧载用的包，正式分发要另外签名 + 公证。
  build-macos:
    name: "Release for macOS"
    runs-on: "xcode-27"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Extract tag name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Echo build progress
        run: echo "Kazumi_macos_${tag} build progress"

      - name: Show Xcode and SDK version
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate --spec macos/project.yml --project macos

      - name: Resolve Swift Packages
        run: |
          set -o pipefail
          xcodebuild -project "$MAC_PROJECT" -scheme "$MAC_SCHEME" -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-mac" | xcbeautify

      - name: Build (no codesign)
        env:
          DANDAN_APP_ID: ${{ secrets.DANDANAPI_APPID }}
          DANDAN_APP_SECRET: ${{ secrets.DANDANAPI_KEY }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$MAC_PROJECT" \
            -scheme "$MAC_SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-mac" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-mac" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            DANDAN_APP_ID="${DANDAN_APP_ID:-}" \
            DANDAN_APP_SECRET="${DANDAN_APP_SECRET:-}" \
            | xcbeautify

      - name: Package unsigned dmg
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData-mac/Build/Products/Release/Kazumi.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到 Kazumi.app：$APP_PATH" >&2
            exit 1
          fi
          # 摆成标准的拖拽安装盘：Kazumi.app + /Applications 的软链。
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP_PATH" "$STAGE/Kazumi.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Kazumi" -srcfolder "$STAGE" -fs HFS+ \
            -format UDZO -ov "Kazumi_macos_${tag}_no_sign.dmg"
          ls -lh "Kazumi_macos_${tag}_no_sign.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos_outputs
          path: Kazumi_macos_*.dmg
          if-no-files-found: error


  # Mac Catalyst：与 iOS 同一个工程，编出能拖拽安装的 Mac App。
  build-catalyst:
    name: "Release for Mac Catalyst"
    runs-on: "xcode-27"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Extract tag name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Show Xcode and SDK version
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios

      - name: Resolve Swift Packages
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-catalyst" | xcbeautify

      - name: Build (no codesign)
        env:
          DANDAN_APP_ID: ${{ secrets.DANDANAPI_APPID }}
          DANDAN_APP_SECRET: ${{ secrets.DANDANAPI_KEY }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "platform=macOS,variant=Mac Catalyst" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-catalyst" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-catalyst" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SUPPORTS_MACCATALYST=YES \
            DANDAN_APP_ID="${DANDAN_APP_ID:-}" \
            DANDAN_APP_SECRET="${DANDAN_APP_SECRET:-}" \
            | xcbeautify

      - name: Package unsigned Catalyst dmg
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData-catalyst/Build/Products" -type d -name 'Runner.app' -print -quit)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "未找到 Catalyst 的 Runner.app" >&2
            exit 1
          fi
          STAGE="$RUNNER_TEMP/catalyst-dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP_PATH" "$STAGE/Kazumi.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Kazumi" -srcfolder "$STAGE" -fs HFS+ \
            -format UDZO -ov "Kazumi_catalyst_${tag}_no_sign.dmg"
          ls -lh "Kazumi_catalyst_${tag}_no_sign.dmg"

      - name: Upload Catalyst artifact
        uses: actions/upload-artifact@v7
        with:
          name: catalyst_outputs
          path: Kazumi_catalyst_*.dmg
          if-no-files-found: error

  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    needs: [build-ios, build-macos, build-catalyst]
    permissions:
      contents: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Extract tag name
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
        shell: bash

      - name: Extract release notes from CHANGELOG
        run: |
          version="${tag#v}"
          awk -v v="$version" '
            index($0, "## " v " ") == 1 { found = 1; next }
            found && (index($0, "## ") == 1 || $0 == "### 构建") { exit }
            found { sub(/\r$/, ""); print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "Kazumi ${tag}" > RELEASE_NOTES.md
          fi
          echo "---------- release notes ----------"
          cat RELEASE_NOTES.md
        shell: bash

      - name: Download IPA
        uses: actions/download-artifact@v8
        with:
          name: ios_outputs
          path: ios_outputs

      - name: Download macOS app
        uses: actions/download-artifact@v8
        with:
          name: macos_outputs
          path: macos_outputs

      - name: Download Catalyst app
        uses: actions/download-artifact@v8
        with:
          name: catalyst_outputs
          path: catalyst_outputs

      - name: List release files
        run: |
          ls -l ios_outputs
          ls -l macos_outputs
          ls -l catalyst_outputs

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            ios_outputs/Kazumi_ios_*.ipa
            macos_outputs/Kazumi_macos_*.dmg
            catalyst_outputs/Kazumi_catalyst_*.dmg
