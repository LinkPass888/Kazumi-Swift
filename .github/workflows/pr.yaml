---
name: "PR workflow"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - 'static/**'
      - '**.md'
      - '.gitignore'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

env:
  SCHEME: Runner
  PROJECT: ios/Runner.xcodeproj
  MAC_SCHEME: Kazumi
  MAC_PROJECT: macos/Kazumi.xcodeproj

jobs:
  build-ios:
    if: ${{ github.event_name == 'workflow_dispatch' || ! github.event.pull_request.draft }}
    name: "Build for iOS"
    # 用 Xcode 27 的镜像（公开预览，label 就叫 xcode-27）：默认 Xcode 27.1、iOS 27 的 SDK。
    # 之前跑在 macos-26 上，默认 Xcode 26.6 / iOS SDK 26.5——同一个 App 编出来的包
    # 和模拟器那版（iOS 27 SDK）不是一套 SDK，系统边缘效果这类东西表现会不一样
    # （LP：手机上顶栏那条模糊看不到，模拟器上有）。改成 27 是为了让两边对齐。
    runs-on: "xcode-27"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      # 不钉版本，就用 xcode-27 镜像默认那个（现在是 Xcode 27.1 / iOS SDK 27.1，LP 3253/3254 定的）。
      # 只把版本号打进日志，编完能直接看到这次是拿哪套 SDK 编的。
      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios

      - name: Resolve Swift Packages
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" | xcbeautify

      - name: Build (no codesign)
        env:
          DANDAN_APP_ID: ${{ secrets.DANDANAPI_APPID }}
          DANDAN_APP_SECRET: ${{ secrets.DANDANAPI_KEY }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            DANDAN_APP_ID="${DANDAN_APP_ID:-}" \
            DANDAN_APP_SECRET="${DANDAN_APP_SECRET:-}" \
            | xcbeautify

      - name: Package canary IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到 Runner.app：$APP_PATH" >&2
            exit 1
          fi
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/Runner.app
          find Payload/Runner.app -type d -name "*.framework" -exec codesign --force --sign - {} \;
          find Payload/Runner.app -type f -name "*.dylib" -exec codesign --force --sign - {} \;
          zip -q -r Kazumi_ios_canary_no_sign.ipa Payload

      - name: Upload canary IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios_outputs
          path: Kazumi_ios_*.ipa
          if-no-files-found: error

  # macOS 版：真 macOS target（不是 Catalyst / Designed for iPad），
  # 工程同样由 xcodegen 生成，源码里有一半是和 iOS 共用的那几层。
  # 只 build、不跑测试，和 iOS 那条一样。
  build-macos:
    if: ${{ github.event_name == 'workflow_dispatch' || ! github.event.pull_request.draft }}
    name: "Build for macOS"
    runs-on: "xcode-27"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Show Xcode and SDK version
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate --spec macos/project.yml --project macos

      # 这一步会把 MPVKit 的 macOS 切片一起拉下来：包解析失败就说明这个 tag
      # 没有 macOS 二进制，播放器的移植路线要另找答案。
      - name: Resolve Swift Packages
        run: |
          set -o pipefail
          xcodebuild -project "$MAC_PROJECT" -scheme "$MAC_SCHEME" -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-mac" | xcbeautify

      - name: Build (no codesign)
        env:
          DANDAN_APP_ID: ${{ secrets.DANDANAPI_APPID }}
          DANDAN_APP_SECRET: ${{ secrets.DANDANAPI_KEY }}
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$MAC_PROJECT" \
            -scheme "$MAC_SCHEME" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-mac" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-mac" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            DANDAN_APP_ID="${DANDAN_APP_ID:-}" \
            DANDAN_APP_SECRET="${DANDAN_APP_SECRET:-}" \
            | xcbeautify

      - name: Package canary dmg
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData-mac/Build/Products/Release/Kazumi.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "未找到 Kazumi.app：$APP_PATH" >&2
            exit 1
          fi
          # 摆成标准的拖拽安装盘：Kazumi.app + /Applications 的软链。
          STAGE="$RUNNER_TEMP/dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP_PATH" "$STAGE/Kazumi.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Kazumi" -srcfolder "$STAGE" -fs HFS+ \
            -format UDZO -ov Kazumi_macos_canary.dmg
          ls -lh Kazumi_macos_canary.dmg

      - name: Upload canary dmg
        uses: actions/upload-artifact@v7
        with:
          name: macos_outputs
          path: Kazumi_macos_canary.dmg
          if-no-files-found: error

  # Mac Catalyst：同一个 iOS 工程、同一套 UIKit 界面，加一个 Mac destination 编出 Mac App。
  # 与上面的真 macOS target 并行存在，等 Catalyst 包确认能用再决定删不删后者。
  build-catalyst:
    if: ${{ github.event_name == 'workflow_dispatch' || ! github.event.pull_request.draft }}
    name: "Build for Mac Catalyst"
    runs-on: "xcode-27"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v7

      - name: Show Xcode and SDK version
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install build tools
        run: brew install xcodegen xcbeautify

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios

      # 包解析这一步就能验证 maccatalyst 切片：MPVKit 的 xcframework 里没有
      # ios-arm64_x86_64-maccatalyst 的话，后面的链接必挂。
      - name: Resolve Swift Packages
        run: |
          set -o pipefail
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -resolvePackageDependencies \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-catalyst" | xcbeautify

      - name: Build (no codesign)
        env:
          DANDAN_APP_ID: ${{ secrets.DANDANAPI_APPID }}
          DANDAN_APP_SECRET: ${{ secrets.DANDANAPI_KEY }}
        run: |
          # Catalyst 的坑：MPVKit 那几个 .framework 是**静态库的壳**（链接期 Xcode 会给
          # codeless framework 注一个 stub），而 macOS 侧不接受浅包布局，收尾校验会报
          # "contains Info.plist, expected Versions/Current/Resources/Info.plist since
          # the platform does not use shallow bundles" 并把整次 build 判失败。
          # 编译、链接、资源拷贝都已在这一步之前完成，所以：只容忍这一种失败，
          # 真正的编译错误照样让 job 红。壳在打包那一步清掉。
          set -o pipefail
          set +e
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "platform=macOS,variant=Mac Catalyst" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData-catalyst" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/spm-catalyst" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SUPPORTS_MACCATALYST=YES \
            DANDAN_APP_ID="${DANDAN_APP_ID:-}" \
            DANDAN_APP_SECRET="${DANDAN_APP_SECRET:-}" \
            2>&1 | tee "$RUNNER_TEMP/catalyst-build.log" | xcbeautify
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -q "does not use shallow bundles" "$RUNNER_TEMP/catalyst-build.log"; then
              echo "只有浅包校验失败，编译与链接已完成，继续打包"
            else
              echo "构建失败（不是浅包校验）" >&2
              exit "$status"
            fi
          fi

      - name: Package canary Catalyst dmg
        run: |
          set -euo pipefail
          APP_PATH="$(find "$RUNNER_TEMP/DerivedData-catalyst/Build/Products" -type d -name 'Runner.app' -print -quit)"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "未找到 Catalyst 的 Runner.app" >&2
            exit 1
          fi
          # 清掉 MPVKit 那几个静态库壳：浅包布局在 macOS 上不合法，运行期也用不到
          # （真代码是静态链接进 Runner 的）。只动 Lib* 前缀的，别碰别人。
          for fw in "$APP_PATH"/Contents/Frameworks/Lib*.framework; do
            [ -d "$fw" ] || continue
            rm -rf "$fw"
          done
          # 删壳之后要确认真代码是静态链进主二进制的：主程序若还动态引用
          # Lib*.framework，删掉它就到运行时才炸。这里当场查出来。
          if otool -L "$APP_PATH/Contents/MacOS/Kazumi" | grep -q "Lib.*\.framework"; then
            echo "主程序仍动态引用 MPVKit 的 framework，不能删壳：" >&2
            otool -L "$APP_PATH/Contents/MacOS/Kazumi" | grep "Lib.*\.framework" >&2
            exit 1
          fi
          # arm64 的二进制必须至少有 ad-hoc 签名才能跑起来。
          codesign --force --deep --sign - "$APP_PATH"
          codesign -dv "$APP_PATH" 2>&1 | head -5 || true
          STAGE="$RUNNER_TEMP/catalyst-dmg-stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp -R "$APP_PATH" "$STAGE/Kazumi.app"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "Kazumi" -srcfolder "$STAGE" -fs HFS+ \
            -format UDZO -ov Kazumi_catalyst_canary.dmg
          ls -lh Kazumi_catalyst_canary.dmg

      - name: Upload canary Catalyst dmg
        uses: actions/upload-artifact@v7
        with:
          name: catalyst_outputs
          path: Kazumi_catalyst_canary.dmg
          if-no-files-found: error
