# XcodeGen 工程描述（macOS 侧）
#
# 与 ios/project.yml 是**两个独立工程**，不是「Designed for iPad / Catalyst」那条路：
#   * iOS 工程把 iOS target 丢给 macOS SDK 编，UIKit 模块直接解析不了（Unable to resolve
#     module UIKit），这条路已经废弃；macOS 版必须是真正的 macOS target。
#   * 源码分两块：macos/Runner 下是 macOS 自己的入口与界面；ios/Runner/NativeApp 下是
#     与 iOS 共用的底层，按层往下加（见 sources 里的注释），加一层 CI 编一层。
#
# 生成工程：xcodegen generate --spec macos/project.yml --project macos
# 产物路径：macos/Kazumi.xcodeproj，scheme 名称 Kazumi，产物 Kazumi.app

name: Kazumi

options:
  bundleIdPrefix: com.linkpass
  # 与 iOS 侧一致：液态玻璃那套 API 要 macOS 26（Tahoe）才有。
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
  knownRegions:
    - zh-Hans
    - zh-Hant
    - Base
  generateEmptyDirectories: false
  groupSortPosition: top
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_LANGUAGE: zh-Hans
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    ENABLE_BITCODE: NO
    # mpv / FFmpeg 库体积大，保留完整调试符号映射（与 iOS 侧同）。
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

packages:
  Fuzi:
    url: https://github.com/cezheng/Fuzi.git
    from: 3.1.3
  # 播放内核。Package.swift 声明了 .macOS(.v12)，macOS 切片在。
  # 现在 MPVEngine.swift 真的引用了它的符号，链接期就能验证这套切片可用。
  MPVKit:
    url: https://github.com/mpvkit/MPVKit.git
    exactVersion: 1.1.0-n9.0.2

targets:
  Kazumi:
    type: application
    platform: macOS
    deploymentTarget: "26.0"

    sources:
      # macOS 自己的入口与界面（这个目录只进 macOS target）。
      # Info.plist 是 xcodegen 按下面的 info.properties 生成的、entitlements 只给签名用，
      # 两个都不能进资源阶段（否则会和 INFOPLIST_FILE 撞出 Multiple commands produce）。
      - path: Runner
        excludes:
          - Info.plist
          - Kazumi.entitlements
      # ——— 以下是和 iOS 共用的底层，纯 Foundation，一行 UIKit 都没有 ———
      # 规则模型 / 规则引擎 / 规则仓库网络层 + 它们依赖的日志与元信息。
      # 往这里加目录之前先跑一遍：grep -l "UI[A-Z]" —— 有 UIKit 的层先别加。
      - path: ../ios/Runner/NativeApp/Features/Plugins/Model
      - path: ../ios/Runner/NativeApp/Features/Plugins/Engine
      - path: ../ios/Runner/NativeApp/Features/Plugins/Network
      # RuleHTTPClient 的 cookie 口袋（只有这个文件不依赖 AppEnvironment）。
      - path: ../ios/Runner/NativeApp/Features/Plugins/Service/PluginCookieStore.swift
      - path: ../ios/Runner/NativeApp/App/Support/KazumiLog.swift
      - path: ../ios/Runner/NativeApp/App/Support/KazumiAppInfo.swift
      # 规则网络层要的代理开关与代理地址解析（两个都是纯 Foundation：
      # 前者只读进程内状态，后者的 SettingsStore 只出现在注释里）。
      - path: ../ios/Runner/NativeApp/App/Support/KazumiNetworkPolicy.swift
      - path: ../ios/Runner/NativeApp/App/Support/ProxyURL.swift
      # 规则市场列表里的「更新于 MM-dd」，读系统日期格式。
      - path: ../ios/Runner/NativeApp/Design/SystemDateText.swift
      # ——— 播放内核（和 iOS 共用同一份，不再另写一份精简版）———
      # 内核本身几乎没有 UIKit：只有 4 处 iOS 独占（UIWindowScene、画中画探测、
      # UIImage 截图 PNG、setNeedsLayout），已经按 os(iOS)/os(macOS) 分开；
      # MPVMetalView 同一个文件里两套宿主（UIView / NSView）。
      # 这一组进来之后 MPVKit 才真的被符号引用（之前只挂在包上，链接时被 dead-strip）。
      - path: ../ios/Runner/NativeApp/Features/Player/MPVEngine.swift
      - path: ../ios/Runner/NativeApp/Features/Player/MPVMetalView.swift
      - path: ../ios/Runner/NativeApp/Features/Player/MPVFrameGrab.swift
      - path: ../ios/Runner/NativeApp/Features/Player/MPVDiagnostics.swift
      - path: ../ios/Runner/NativeApp/Features/Player/PlaybackCachePolicy.swift
      - path: ../ios/Runner/NativeApp/Features/Player/PlayerErrorMessage.swift
      - path: ../ios/Runner/NativeApp/Features/Player/PlayerSurfaceModel.swift
      # 「选一项」菜单的数据模型（渲染各走各平台的原生控件）。
      - path: ../ios/Runner/NativeApp/Features/Player/SelectionMenuModel.swift
      # 硬解档位（从 SettingsStore 里拆出来的纯枚举，SettingsStore 本身带界面依赖）。
      - path: ../ios/Runner/NativeApp/App/State/HardwareDecodeMode.swift
      # 「mpv: ...」这条日志口袋。
      - path: ../ios/Runner/NativeApp/App/Support/KazumiLogBuffer.swift
      # 字符串目录直接借 iOS 那份：以后移植过来的页面不用再建一套。
      - path: ../ios/Runner/Localizable.xcstrings
        buildPhase: resources
      # 内置默认规则（规则市场与首次启动都要用）。
      - path: ../assets/statements
        type: folder
        buildPhase: resources
        optional: true
      - path: ../licenses
        type: folder
        buildPhase: resources
        optional: true

    info:
      path: Runner/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: Kazumi
        CFBundleName: Kazumi
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.entertainment
        NSHumanReadableCopyright: ""
        # 规则站与视频源都是 http/https 混着来的，和 iOS 侧同一套放行。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSAllowsLocalNetworking: true
        # DanDanPlay 弹幕接口的默认配置（构建时用同一个 Secret 注入，见 CI）。
        DanDanApiUrl: $(DANDAN_API_URL)
        DanDanAppId: $(DANDAN_APP_ID)
        DanDanAppSecret: $(DANDAN_APP_SECRET)
        # 深链，与 iOS 侧同名 scheme。
        CFBundleURLTypes:
          - CFBundleURLName: com.predidit.kazumi.navigation
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - kazumi

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linkpass.kazumi
        PRODUCT_NAME: Kazumi
        EXECUTABLE_NAME: Kazumi
        MARKETING_VERSION: "3.0.5"
        CURRENT_PROJECT_VERSION: "30005"
        INFOPLIST_FILE: Runner/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Runner/Kazumi.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        DANDAN_API_URL: "https://api.dandanplay.net"
        DANDAN_APP_ID: ""
        DANDAN_APP_SECRET: ""

    dependencies:
      # XHTML / XPath 解析（规则引擎用）。
      - package: Fuzi
      - package: MPVKit

schemes:
  Kazumi:
    build:
      targets:
        Kazumi: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release